name: Build Typst document
on:
  push:
    paths-ignore:
      - '**/README.md'
    branches:
      - main
      - master
jobs:
  build_typst:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Check out Source Sans 3 fonts
        uses: actions/checkout@v6
        with:
          repository: adobe-fonts/source-sans
          ref: 3.052R
          path: .fonts
          sparse-checkout: OTF
          persist-credentials: false
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - name: Compile Typst document
        run: |
          typst compile --font-path .fonts/OTF resume.typ resume.pdf
      - name: Generate thumbnail
        run: |
          typst compile --font-path .fonts/OTF --ppi 150 resume.typ resume.png
      - name: Run an Oracle Cloud Infrastructure (OCI) CLI command
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: os object put --bucket-name ${{ secrets.OCI_BUCKET }} --file resume.pdf --name MatthewLamResume.pdf --content-type application/pdf --force
      - name: Run an Oracle Cloud Infrastructure (OCI) CLI command
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: os object put --bucket-name ${{ secrets.OCI_BUCKET }} --file resume.png --content-type image/png --force
